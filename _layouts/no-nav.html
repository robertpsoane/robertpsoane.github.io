---
layout: compress
---

{% include head.html %}

<main>
    <article id="main-content">
        <h1>{{ page.title }}</h1>
        {{ content }}
    </article>

    <div class="post-navigation"
        style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem;">

        <div class="prev-link">
            {% if page.prev_url %}
            <a href="{{ page.prev_url }}">
                &larr; Previous
            </a>
            {% endif %}
        </div>

        <div class="next-link">
            {% if page.next_url %}
            <a href="{{ page.next_url }}">
                Next &rarr;
            </a>
            {% endif %}
        </div>

    </div>
</main>

{% include footer.html %}
